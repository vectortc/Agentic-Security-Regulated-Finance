[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "casebound-models"
version = "0.3.0"
description = "Model clients (Claude via the Anthropic SDK; record/replay) for casebound's gated model adapter."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["casebound>=0.3", "anthropic>=1.8,<2"]

[project.optional-dependencies]
# Google Cloud: Gemini via google-genai, and Claude on Vertex via AnthropicVertex (both use ADC)
vertex = ["google-genai>=2.25,<3", "anthropic[vertex]>=1.8,<2"]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/casebound_models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: calls the real Anthropic API; set CASEBOUND_LIVE_MODEL_TESTS=1 to run"]
